name: GitHub Activity
on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jamesgeorge007/github-activity-readme@v0.5.0
        with:
          GH_USERNAME: AndrewBulatao
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}